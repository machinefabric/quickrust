[package]
name = "qrust-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
description = "Speed index: the same developer loop through upstream Cargo and through QuickRust"
license = "Apache-2.0"

# It measures on Linux and macOS only, where it reads the system's accounting of a process tree;
# elsewhere it is a program that refuses (src/main.rs) and needs none of these.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
libc = "0.2"
