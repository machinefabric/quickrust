name: Release

# A tag `v<version>` (the version in version.txt) builds Haul for every platform it is published
# for and creates a draft release with the archives, their checksums, version.txt and the install
# scripts. Publishing the draft is a deliberate step, done by hand: `haul self update` and the
# install scripts read the latest published release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < version.txt)"
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      # Static Linux builds: the C parts (ring, liblzma) are compiled with musl-gcc.
      - name: musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p haul --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=haul-${{ matrix.target }}
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/haul$ext" "target/${{ matrix.target }}/release/haul-rustc-wrapper$ext" "dist/$name/"
          "dist/$name/haul$ext" --version | grep -qx "haul $(tr -d '[:space:]' < version.txt)" || { echo "the binary does not report the release's version"; exit 1; }
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: haul-${{ matrix.target }}
          path: |
            dist/haul-${{ matrix.target }}.tar.gz
            dist/haul-${{ matrix.target }}.tar.gz.sha256

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp version.txt install.sh install.ps1 dist/
          gh release create "$GITHUB_REF_NAME" --draft --title "Haul ${GITHUB_REF_NAME#v}" --notes "Install: \`curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh\` (Windows: \`irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex\`). Update an installed Haul: \`haul self update\`." dist/*
