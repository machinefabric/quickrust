name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # QuickRust itself builds with the runner's rustup; the builds the suites observe use the
      # toolchains QuickRust installs into its own store, kept between runs for a day (each day's
      # first run installs them anew, from the dist server, through QuickRust).
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: QuickRust's toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.cache/qrust-test-toolchains
          key: qrust-toolchains-${{ runner.os }}-${{ steps.day.outputs.day }}
      # The fast-linker test runs only where wild is installed (Linux with glibc).
      - name: wild
        if: runner.os == 'Linux'
        run: cargo install --locked wild-linker
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # QuickRust declares `rust-version = 1.80`: built and tested with exactly that compiler, from the
  # lockfile (newer releases of some dependencies need newer Rust). The builds the suites observe
  # use the toolchains QuickRust installs.
  msrv:
    name: test (Rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          rustup toolchain install 1.80 --profile minimal
          rustup toolchain install stable --profile minimal
          rustup default stable
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: QuickRust's toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.cache/qrust-test-toolchains
          key: qrust-toolchains-msrv-${{ runner.os }}-${{ steps.day.outputs.day }}
      - name: Tests
        run: cargo +1.80 test --locked --workspace

  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      # The integration suites are Unix-only today (Windows card on the project board), and so is
      # the benchmark harness (it measures child processes with wait4).
      - name: Check
        run: cargo clippy --all-targets -p quickrust -- -D warnings

  # What a Windows user gets from install.ps1, run end to end: QuickRust sets itself up (installing
  # stable Rust from the dist server into its own home), then creates, builds, runs and tests a
  # project, with nothing of rustup's on PATH.
  windows-smoke:
    name: smoke (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build
        run: cargo build --release -p quickrust
      - name: Set up, then a project through QuickRust
        shell: bash
        env:
          QRUST_HOME: ${{ runner.temp }}\qrust-home
        run: |
          set -eux
          target/release/qrust.exe setup --no-modify-path 2>&1 | tee setup.log
          if grep -q "compiler driver cannot be built" setup.log; then exit 1; fi
          bin="$(cygpath -u "$QRUST_HOME")/bin"
          export PATH="$bin:/usr/bin:/c/Windows/system32:/c/Windows"
          test "$(command -v cargo)" = "$bin/cargo"
          cd "$RUNNER_TEMP"
          cargo new --vcs none hello
          cd hello
          cargo build
          test ! -e target
          test "$(cargo run)" = "Hello, world!"
          cargo test
          qrust driver status | grep "^built:"
          # Paths as people write them, and no session outliving its command.
          qrust doctor | tee doctor.log
          if grep -F '\\?\' doctor.log; then exit 1; fi
          grep -E "active sessions +0$" doctor.log
      # QuickRust's background work, when something did not finish.
      - name: What QuickRust left running, and its logs
        if: failure() || cancelled()
        shell: bash
        env:
          QRUST_HOME: ${{ runner.temp }}\qrust-home
        run: |
          tasklist | grep -i -E "qrust|cargo|rustc" || true
          home="$(cygpath -u "$QRUST_HOME")"
          for f in "$home"/cache/gc.log "$home"/cache/gc-log.jsonl "$home"/toolchains/.update.log "$home"/cache/drivers/*/build.log "$home"/active/*.json; do
            if [ -f "$f" ]; then echo "== $f"; cat "$f"; echo; fi
          done
          for pid in $(cat "$home"/active/*.json 2>/dev/null | grep -o '"pid":[0-9]*' | cut -d: -f2); do
            echo "== process $pid"; tasklist //FI "PID eq $pid" || true
          done
