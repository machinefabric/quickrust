name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # The suites skip what is missing; installing it makes them run: `+toolchain` tests need
      # a second toolchain, the cross-check test needs the wasm32 target.
      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustup default stable
      # The fast-linker test runs only where wild is installed (Linux with glibc).
      - name: wild
        if: runner.os == 'Linux'
        run: cargo install --locked wild-linker
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Haul declares `rust-version = 1.80`: built and tested with exactly that compiler, from the
  # lockfile (newer releases of some dependencies need newer Rust). The builds the suites observe
  # run on stable.
  msrv:
    name: test (Rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          rustup toolchain install 1.80 --profile minimal
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Tests
        run: cargo +1.80 test --locked --workspace

  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      # The integration suites are Unix-only today (Windows card on the project board), and so is
      # the benchmark harness (it measures child processes with wait4).
      - name: Check
        run: cargo clippy --all-targets -p haul -- -D warnings
