name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Haul itself builds with the runner's rustup; the builds the suites observe use the
      # toolchains Haul installs into its own store, kept between runs for a day (each day's
      # first run installs them anew, from the dist server, through Haul).
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Haul's toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.cache/haul-test-toolchains
          key: haul-toolchains-${{ runner.os }}-${{ steps.day.outputs.day }}
      # The fast-linker test runs only where wild is installed (Linux with glibc).
      - name: wild
        if: runner.os == 'Linux'
        run: cargo install --locked wild-linker
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Haul declares `rust-version = 1.80`: built and tested with exactly that compiler, from the
  # lockfile (newer releases of some dependencies need newer Rust). The builds the suites observe
  # use the toolchains Haul installs.
  msrv:
    name: test (Rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          rustup toolchain install 1.80 --profile minimal
          rustup toolchain install stable --profile minimal
          rustup default stable
      - id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Haul's toolchain store
        uses: actions/cache@v4
        with:
          path: ~/.cache/haul-test-toolchains
          key: haul-toolchains-msrv-${{ runner.os }}-${{ steps.day.outputs.day }}
      - name: Tests
        run: cargo +1.80 test --locked --workspace

  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      # The integration suites are Unix-only today (Windows card on the project board), and so is
      # the benchmark harness (it measures child processes with wait4).
      - name: Check
        run: cargo clippy --all-targets -p haul -- -D warnings
