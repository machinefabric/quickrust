[package]
name = "quickrust-dist"
version.workspace = true
edition = "2021"
rust-version = "1.80"
publish = false
description = "Builds QuickRust's release archives: the two programs of a platform, with the licence and the README"
license = "Apache-2.0"

[dependencies]
flate2 = "1"
serde_json = "1"
tar = { version = "0.4", default-features = false }
toml = "0.8"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

# The archives are checked against the program that installs them.
[dev-dependencies]
quickrust = { path = "../.." }
