[package]
name = "quickrust"
version = "0.144.406"
edition = "2021"
rust-version = "1.80"
description = "Cargo, faster: every Cargo command, with Rust toolchains, a shared build cache and output that QuickRust manages"
license = "MIT OR Apache-2.0"
default-run = "qrust"

# The benchmark harness is a separate member so its code never ships in QuickRust.
[workspace]
members = [".", "bench"]

[lib]
name = "quickrust"
path = "src/lib.rs"

# `qrust` is a multi-call binary: run as `cargo` (and as `rustc`, `rustfmt`, …, the proxies
# `qrust setup` makes in ~/.qrust/bin) it is that program. No bin target is named `cargo`, so that
# nothing installing this crate can put a `cargo` anywhere.
[[bin]]
name = "qrust"
path = "src/bin/qrust.rs"

[[bin]]
name = "qrust-rustc-wrapper"
path = "src/bin/qrust-rustc-wrapper.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
# Content hashes of the artifact cache. 1.8.3 and later need Rust 1.85 (edition 2024);
# QuickRust declares 1.80.
blake3 = "=1.8.2"
# Downloads (toolchains, registry index lines, crates): rustls with ring, roots from webpki-roots,
# proxies from the environment. ureq 3 needs Rust 1.85.
ureq = { version = "2.12", default-features = false, features = ["tls", "proxy-from-env"] }
# Toolchain components are .tar.xz; liblzma is built from its bundled sources.
liblzma = { version = "0.4", features = ["static"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
debug = false
strip = true
