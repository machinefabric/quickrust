[package]
name = "haul"
version = "0.137.166"
edition = "2021"
rust-version = "1.80"
description = "Drop-in Cargo replacement: an orchestration, observability and policy layer around upstream Cargo"
license = "MIT OR Apache-2.0"
default-run = "haul"

# The benchmark harness is a separate member so its code never ships in Haul.
[workspace]
members = [".", "bench"]

[lib]
name = "haul"
path = "src/lib.rs"

# `haul` is a multi-call binary: invoked under the name `cargo` it is the
# compatibility shim. No bin target is named `cargo` on purpose, so that
# `cargo install` can never overwrite rustup's proxy; use `haul install-shim`.
[[bin]]
name = "haul"
path = "src/bin/haul.rs"

[[bin]]
name = "haul-rustc-wrapper"
path = "src/bin/haul-rustc-wrapper.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"
# Content hashes of the artifact cache. 1.8.3 and later need Rust 1.85 (edition 2024);
# Haul declares 1.80.
blake3 = "=1.8.2"
# Downloads (toolchains, registry index lines, crates): rustls with ring, roots from webpki-roots,
# proxies from the environment. ureq 3 needs Rust 1.85.
ureq = { version = "2.12", default-features = false, features = ["tls", "proxy-from-env"] }
# Toolchain components are .tar.xz; liblzma is built from its bundled sources.
liblzma = { version = "0.4", features = ["static"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
debug = false
strip = true
