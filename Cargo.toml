[[bin]]
name = "haul"
path = "src/bin/haul.rs"

[[bin]]
name = "haul-rustc-wrapper"
path = "src/bin/haul-rustc-wrapper.rs"

[dependencies]
blake3 = "=1.8.2"
sha2 = "0.10"
toml = "0.8"

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.serde_json]
features = ["preserve_order"]
version = "1"

[lib]
name = "haul"
path = "src/lib.rs"

[package]
default-run = "haul"
description = "Drop-in Cargo replacement: an orchestration, observability and policy layer around upstream Cargo"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "haul"
rust-version = "1.80"
version = "0.99.573"

[profile.release]
debug = false
opt-level = 3
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[workspace]
members = [".", "bench"]
